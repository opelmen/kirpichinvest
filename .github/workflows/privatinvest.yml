name: Deploy privatinvest prototype

on:
  push:
    branches: [main, "claude/**"]
    paths: ["privatinvest/**", "privatinvest_src/**", ".github/workflows/privatinvest.yml"]
  workflow_dispatch:

concurrency:
  group: privatinvest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Landing pages are built from privatinvest_src (no stale HTML)
        run: |
          set -euo pipefail
          python3 privatinvest_src/build.py
          git status --porcelain privatinvest/
          if [ -n "$(git status --porcelain privatinvest/)" ]; then echo "Run python3 privatinvest_src/build.py and commit the result"; git diff --stat; exit 1; fi

      - name: Domain history (Wayback, RDAP) for SEO
        continue-on-error: true
        run: |
          echo "=== RDAP"
          curl -sSL --max-time 30 https://rdap.org/domain/privateinvest.pro | python3 -c "import json,sys;d=json.load(sys.stdin);print([(e.get('eventAction'),e.get('eventDate')) for e in d.get('events',[])]);print('ns:',[n.get('ldhName') for n in d.get('nameservers',[])])" || true
          echo "=== Wayback snapshots by year"
          curl -sS --max-time 60 "https://web.archive.org/cdx/search/cdx?url=privateinvest.pro&output=json&fl=timestamp,statuscode&collapse=timestamp:6" | python3 -c "
          import json,sys,collections
          rows=json.load(sys.stdin)[1:]
          c=collections.Counter(r[0][:4] for r in rows);print(dict(sorted(c.items())));print('first',rows[:1],'last',rows[-1:])" || true
          echo "=== Wayback URLs (old site structure)"
          curl -sS --max-time 60 "https://web.archive.org/cdx/search/cdx?url=privateinvest.pro/*&fl=original,timestamp,statuscode&collapse=urlkey&limit=80" || true
          for y in 2023 2024 2025; do
            echo "=== snapshot $y"
            u=$(curl -sS --max-time 30 "https://archive.org/wayback/available?url=privateinvest.pro&timestamp=${y}0601" | python3 -c "import json,sys;print((json.load(sys.stdin).get('archived_snapshots',{}).get('closest') or {}).get('url',''))")
            echo "$u"; [ -n "$u" ] && curl -sSL --max-time 40 "$u" | python3 -c "import sys,re,html;s=sys.stdin.read();t=re.search(r'<title>(.*?)</title>',s,re.S);print('title:',html.unescape(t.group(1).strip()) if t else None);x=re.sub(r'<script.*?</script>|<style.*?</style>','',s,flags=re.S);x=re.sub(r'<[^>]+>',' ',x);print(' '.join(html.unescape(x).split())[:600])" || true
          done

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 fond178.beget.tech >> ~/.ssh/known_hosts

      - name: TLS certificate and http->https check (diagnostics)
        continue-on-error: true
        run: |
          for h in privateinvest.pro www.privateinvest.pro; do
            echo "=== $h"
            echo | timeout 20 openssl s_client -servername $h -connect $h:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1 | head -12
            curl -sS -o /dev/null -w "https verify: %{ssl_verify_result} code %{http_code}\n" --max-time 20 https://$h/ 2>&1 | tail -1
            curl -sS -o /dev/null -w "http code %{http_code} -> %{redirect_url}\n" --max-time 20 http://$h/ 2>&1 | tail -1
          done
          dig +short privateinvest.pro A www.privateinvest.pro A || true

      - name: Check that the domain folder exists on Beget
        run: |
          set -euo pipefail
          # домен на Beget называется privateinvest.pro (латиницей)
          ssh fond178@fond178.beget.tech 'd=~/privateinvest.pro/public_html; if test -d "$d"; then echo "OK: $d"; ls -la "$d" | head -20; else echo "NO domain folder. Home listing:"; ls -1 ~; exit 1; fi'

      - name: Backup current site and deploy
        run: |
          set -euo pipefail
          ssh fond178@fond178.beget.tech 'set -e; d=~/privateinvest.pro/public_html; mkdir -p ~/privatinvest-backups; tar -czf ~/privatinvest-backups/$(date +%Y%m%d-%H%M%S).tar.gz -C "$d" . ; ls -1t ~/privatinvest-backups | tail -n +6 | xargs -r -I{} rm -f ~/privatinvest-backups/{}'
          rsync -az --delete --exclude='.well-known' privatinvest/ fond178@fond178.beget.tech:privateinvest.pro/public_html/
          echo "Deployed: https://privateinvest.pro/"

      - name: Showcase feed from Zalog Desk (no personal data)
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 https://check.kirpichinvest.ru/public/showcase.json -o /tmp/sc.json
          python3 - <<'PY'
          import json, re
          raw = open('/tmp/sc.json', encoding='utf-8').read()
          d = json.loads(raw)
          print('items:', len(d['items']), 'updated:', d.get('updated'))
          for it in d['items']:
              print(it['id'], '|', it['type'], '|', it['city'], '|', it['street'], '|', it['loan'], it['rate'], it['ltv'], '| checks:', len(it['checks']))
          assert not re.search(r'\d{2}:\d{2}:\d{6,7}:\d+', raw), 'cadastral number in feed'
          assert not re.search(r'\b\d{12}\b', raw), 'INN-like number in feed'
          PY

      - name: Smoke check
        run: |
          set -euo pipefail
          sleep 5
          for u in https://privateinvest.pro/ http://privateinvest.pro/; do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' --max-time 30 -L "$u" || true)
            echo "$u -> HTTP $code"
            if grep -q 'Приватинвест' /tmp/p.html && grep -q 'showcase.json' /tmp/p.html; then echo "page content OK at $u"; exit 0; fi
          done
          echo 'page content missing'; head -c 500 /tmp/p.html; exit 1

      - name: http -> https redirect (rollback .htaccess on loop)
        run: |
          set -uo pipefail
          sleep 3
          for u in http://privateinvest.pro/ http://www.privateinvest.pro/ https://www.privateinvest.pro/; do
            curl -s -o /dev/null -w "$u -> %{http_code} %{redirect_url}\n" --max-time 20 "$u"
          done
          final=$(curl -s -o /tmp/r.html -w '%{http_code} %{url_effective}' --max-time 30 -L --max-redirs 5 http://privateinvest.pro/)
          echo "http final: $final"
          if [ "${final%% *}" != "200" ] || ! grep -q 'Приватинвест' /tmp/r.html; then
            echo "redirect broken, removing .htaccess"
            ssh fond178@fond178.beget.tech 'rm -f ~/privateinvest.pro/public_html/.htaccess'
            exit 1
          fi
          case "$final" in *https://privateinvest.pro/*) echo "redirect OK";; *) echo "no https redirect"; exit 1;; esac

      - name: Yandex Metrika on the live page
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 https://privateinvest.pro/ -o /tmp/live.html
          grep -q "ym(113877734, 'init'" /tmp/live.html && echo "counter code: in HTML" || { echo "counter code: MISSING"; exit 1; }
          grep -q 'yandex-verification" content="54da038aafe8c1a9' /tmp/live.html && echo "webmaster meta: in HTML" || echo "webmaster meta: MISSING"
          echo "tag.js: HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://mc.yandex.ru/metrika/tag.js?id=113877734)"
          # настоящий браузер: уходит ли хит счётчика при открытии страницы
          cd /tmp && npm i -s puppeteer-core@23.11.1 >/dev/null 2>&1
          CHROME=$(command -v google-chrome || command -v chromium-browser) node -e '
            const p=require("/tmp/node_modules/puppeteer-core");(async()=>{
              const b=await p.launch({executablePath:process.env.CHROME,args:["--no-sandbox"]});const pg=await b.newPage();
              const hits=[],errs=[];pg.on("request",r=>{if(/mc\.yandex\.(ru|com)\/watch\/113877734/.test(r.url()))hits.push(r.url().slice(0,80))});
              pg.on("pageerror",e=>errs.push(e.message));pg.on("requestfailed",r=>{if(/yandex/.test(r.url()))errs.push("failed "+r.url().slice(0,80)+" "+r.failure().errorText)});
              await pg.goto("https://privateinvest.pro/?utm_source=ci_check",{waitUntil:"networkidle2",timeout:60000});await new Promise(r=>setTimeout(r,5000));
              console.log("metrika hits:",hits.length,hits[0]||"");console.log("errors:",errs.length?errs:"none");await b.close();
            })().catch(e=>{console.log("browser check failed:",e.message)})'

      - name: Landing pages, sitemap and robots on the live site
        run: |
          set -euo pipefail
          bad=0
          for u in $(python3 -c "import re;print(' '.join(re.findall(r'<loc>(.*?)</loc>',open('privatinvest/sitemap.xml').read())))"); do
            code=$(curl -s -o /tmp/lp.html -w '%{http_code}' --max-time 30 "$u")
            canon=$(grep -o '<link rel="canonical" href="[^"]*"' /tmp/lp.html | head -1 | sed 's/.*href="//;s/"$//')
            echo "$code $u canonical=$canon"
            [ "$code" = 200 ] && [ "$canon" = "$u" ] || bad=1
          done
          echo "404 page: $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://privateinvest.pro/net-takoy-stranicy/)"
          r=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" --max-time 20 https://privateinvest.pro/brokeram); echo "no-slash redirect: $r"
          exit $bad

      - name: IndexNow (Yandex) for all sitemap URLs
        continue-on-error: true
        run: |
          set -euo pipefail
          key=$(basename $(ls privatinvest/*.txt | grep -E '/[0-9a-f]{32}\.txt$' | head -1) .txt)
          live=$(curl -fsS --max-time 20 https://privateinvest.pro/$key.txt)
          [ "$live" = "$key" ] || { echo "key file not live"; exit 1; }
          python3 - "$key" <<'PY'
          import json,re,sys,urllib.request
          key=sys.argv[1]
          urls=re.findall(r'<loc>(.*?)</loc>',open('privatinvest/sitemap.xml').read())
          body=json.dumps({"host":"privateinvest.pro","key":key,"keyLocation":"https://privateinvest.pro/%s.txt"%key,"urlList":urls}).encode()
          for ep in ("https://yandex.com/indexnow","https://api.indexnow.org/indexnow"):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(ep,data=body,headers={"Content-Type":"application/json; charset=utf-8"}),timeout=45)
                  print(ep,r.status,len(urls),"urls")
              except Exception as e:
                  print(ep,"error",getattr(e,'code',''),e)
          PY
