name: Deploy to Beget

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3,9,15 * * *"   # пересборка со свежими лотами 3 раза в день (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: |
          pip install -q jinja2==3.1.4 markdown==3.7
          if curl -sf --max-time 60 https://check.kirpichinvest.ru/public/lots.json -o /tmp/lots.json \
             && python -c "import json,sys; d=json.load(open('/tmp/lots.json')); print('лотов из сервиса:', len(d)); sys.exit(0 if isinstance(d, list) else 1)" | tee /tmp/build.log; then
            cp /tmp/lots.json _src/data/lots.json
          else
            echo "!! сервис лотов недоступен — собираю без обновления лотов"
          fi
          curl -sf --max-time 60 https://check.kirpichinvest.ru/public/results.json -o _src/data/results.json \
            && python -c "import json; print('итогов торгов:', len(json.load(open('_src/data/results.json'))))" | tee -a /tmp/build.log \
            || echo '[]' > _src/data/results.json
          curl -sf --max-time 60 https://check.kirpichinvest.ru/public/results-debug.json -o /tmp/results_debug.json || true
          python _src/build.py | tee -a /tmp/build.log

      - name: Deploy via rsync
        env:
          SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 fond178.beget.tech >> ~/.ssh/known_hosts
          rsync -az --delete --exclude '.DS_Store' _site/ fond178@fond178.beget.tech:~/kirpichinvest.ru/public_html/
          echo "Опубликовано страниц: $(find _site -name '*.html' | wc -l)" | tee -a /tmp/build.log

      - name: IndexNow (Яндекс, Bing) — новые страницы
        continue-on-error: true
        run: |
          git fetch -q origin deploy-log && git show origin/deploy-log:urls.txt > /tmp/prev_urls.txt 2>/dev/null || : > /tmp/prev_urls.txt
          sort -u _site/urls.txt > /tmp/cur.txt; sort -u /tmp/prev_urls.txt > /tmp/prev.txt
          comm -13 /tmp/prev.txt /tmp/cur.txt | head -9000 > /tmp/new_urls.txt
          echo "новых URL для IndexNow: $(wc -l < /tmp/new_urls.txt)" | tee -a /tmp/build.log
          python - <<'PY' | tee -a /tmp/build.log
          import json, urllib.request
          key = json.load(open("_src/config.json")).get("INDEXNOW_KEY", "")
          urls = [u.strip() for u in open("/tmp/new_urls.txt") if u.strip()]
          if key and urls:
              body = json.dumps({"host": "kirpichinvest.ru", "key": key, "keyLocation": f"https://kirpichinvest.ru/{key}.txt", "urlList": urls}).encode()
              for ep in ("https://yandex.com/indexnow", "https://api.indexnow.org/indexnow"):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(ep, data=body, headers={"Content-Type": "application/json; charset=utf-8"}), timeout=30)
                      print("IndexNow", ep, r.status)
                  except Exception as e:
                      print("IndexNow", ep, "ошибка:", e)
          PY

      - name: Save log
        if: always()
        env:
          GH: ${{ github.token }}
        run: |
          { echo "== $(date -u) ${GITHUB_SHA::7} ${{ github.event_name }}"; cat /tmp/build.log 2>/dev/null; echo "result: ${{ job.status }}"; } > /tmp/last.log
          cp _src/data/lots.json /tmp/lots.json 2>/dev/null || true
          find _site -name index.html 2>/dev/null | sed 's#_site##;s#index.html##' | sort > /tmp/pages.txt || true
          cp _site/urls.txt /tmp/urls.txt 2>/dev/null || true
          mkdir /tmp/lr && cd /tmp/lr && git init -q && git remote add origin "https://x-access-token:${GH}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name deploy-bot; git config user.email deploy@bot
          git fetch -q origin deploy-log && git checkout -q deploy-log || git checkout -q --orphan deploy-log
          cp /tmp/last.log /tmp/lots.json /tmp/pages.txt /tmp/urls.txt /tmp/results_debug.json . 2>/dev/null || true
          git add -A && git commit -qm "log ${GITHUB_SHA::7}" && git push -q origin deploy-log
