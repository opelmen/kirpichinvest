# Сборка и проверка сайта torggid.ru при push в main (без выкладки).
# Выкладка с 03.11.2026 — из приватного репозитория opelmen/zalog-desk, workflow site.yml (3 раза в день и вручную):
# хостинг Биггет пропал 02.11.2026, новый сервер 193.232.90.5 пускает только по ключу root, а ключ root
# в публичном репозитории не держим. После слияния правок сюда — запустить zalog-desk → Actions → site → Run workflow.
name: "Build site (deploy: zalog-desk site.yml)"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Empty card history (the real one lives on the server)
        run: printf '[]' > _src/data/lot_history.json && printf '[]' > _src/data/auto_history.json

      - name: Build and test site (fail closed on missing feed)
        run: |
          set -euo pipefail
          pip install -q jinja2==3.1.4 markdown==3.7
          curl -fsS --retry 2 --max-time 60 https://check.kirpichinvest.ru/public/lots.json -o /tmp/lots.json || echo 'old feed unavailable'
          # Выгрузка приложения ТоргГид: вся страна и все площадки. Пока её нет (или она подозрительно мала) — прежний фид Залог-Деска.
          curl -fsS --retry 2 --max-time 180 "${MARKET_FEED_URL:-https://api.torggid.ru/api/v1/public/feed}" -o /tmp/market.json || echo 'market feed unavailable'
          python - <<'PYCODE'
          import json
          from pathlib import Path
          history = json.load(open('_src/data/lot_history.json'))
          previous_active = sum(d.get('status') == 'active' for d in history)
          def load(path):
              try:
                  return json.load(open(path))
              except (OSError, ValueError):
                  return None
          market = load('/tmp/market.json')
          rows = market.get('lots') if isinstance(market, dict) else None
          if (isinstance(rows, list) and rows and all(isinstance(d, dict) and d.get('id') for d in rows)
                  and len({str(d['id']) for d in rows}) == len(rows) and len(rows) >= previous_active * .5):
              Path('_src/data/market.json').write_text(json.dumps(market, ensure_ascii=False))
              print(f'feed: market, {len(rows)} lots')
          else:
              data = load('/tmp/lots.json')
              assert isinstance(data, list) and data, 'Empty/invalid feed: keep existing website'
              assert all(isinstance(d, dict) and d.get('id') for d in data)
              assert len({str(d['id']) for d in data}) == len(data), 'Duplicate feed IDs'
              assert not previous_active or len(data) >= previous_active * .5, 'Feed fell by over 50%; review before deploying'
              Path('_src/data/lots.json').write_text(json.dumps(data, ensure_ascii=False))
              print(f'feed: zalog-desk, {len(data)} lots')
          PYCODE
          curl -fsS --max-time 60 https://check.kirpichinvest.ru/public/results.json -o _src/data/results.json || echo '[]' > _src/data/results.json
          # Техника с торгов для раздела /auto/: без выгрузки раздел не собирается, но сайт выкладывается.
          # Выгрузка меньше половины прошлой активной — подозрительна: оставляем прошлую историю без новых лотов.
          curl -fsS --retry 2 --max-time 180 "${VEHICLES_FEED_URL:-https://api.torggid.ru/api/v1/public/vehicles}" -o /tmp/vehicles.json || echo 'vehicles feed unavailable'
          python - <<'PYCODE'
          import json
          from pathlib import Path
          prev = sum(d.get('status') == 'active' for d in json.load(open('_src/data/auto_history.json')))
          try:
              feed = json.load(open('/tmp/vehicles.json'))
          except (OSError, ValueError):
              feed = None
          rows = feed.get('lots') if isinstance(feed, dict) else None
          if (isinstance(rows, list) and rows and all(isinstance(d, dict) and d.get('id') for d in rows)
                  and len({str(d['id']) for d in rows}) == len(rows) and len(rows) >= prev * .5):
              Path('_src/data/vehicles.json').write_text(json.dumps(feed, ensure_ascii=False))
              print(f'vehicles: {len(rows)} lots')
          else:
              print(f'vehicles feed skipped: rows={len(rows) if isinstance(rows, list) else None}, previous active={prev}')
          PYCODE
          python -m unittest discover -s tests -v
          python _src/build.py | tee /tmp/build.log
          node tests/check_forms.cjs _site/index.html

      - name: Lead API accepts forms from the site domain (CORS)
        run: |
          set -euo pipefail
          origin=$(python -c "import sys; sys.path.insert(0, '_src'); from build import cfg; print(cfg.SITE_URL)")
          allowed=$(curl -sS -X OPTIONS -D - -o /dev/null --max-time 30 -H "Origin: $origin" \
            -H "Access-Control-Request-Method: POST" https://check.kirpichinvest.ru/public/lead \
            | tr -d '\r' | sed -n 's/^[Aa]ccess-[Cc]ontrol-[Aa]llow-[Oo]rigin: //p')
          echo "CORS for $origin: ${allowed:-none}"
          test "$allowed" = "$origin"
