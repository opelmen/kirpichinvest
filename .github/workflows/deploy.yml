name: Deploy to Beget

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3,9,15 * * *"   # пересборка со свежими лотами 3 раза в день (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: |
          pip install -q jinja2==3.1.4 markdown==3.7
          if curl -sf --max-time 60 https://check.kirpichinvest.ru/public/lots.json -o /tmp/lots.json \
             && python -c "import json,sys; d=json.load(open('/tmp/lots.json')); print('лотов из сервиса:', len(d)); sys.exit(0 if isinstance(d, list) else 1)" | tee /tmp/build.log; then
            cp /tmp/lots.json _src/data/lots.json
          else
            echo "!! сервис лотов недоступен — собираю без обновления лотов"
          fi
          python _src/build.py | tee -a /tmp/build.log

      - name: Deploy via rsync
        env:
          SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 fond178.beget.tech >> ~/.ssh/known_hosts
          rsync -az --delete --exclude '.DS_Store' _site/ fond178@fond178.beget.tech:~/kirpichinvest.ru/public_html/
          echo "Опубликовано страниц: $(find _site -name '*.html' | wc -l)" | tee -a /tmp/build.log

      - name: Save log
        if: always()
        run: |
          { echo "== $(date -u) ${GITHUB_SHA::7} ${{ github.event_name }}"; cat /tmp/build.log 2>/dev/null; echo "result: ${{ job.status }}"; } > /tmp/last.log
          git config user.name deploy-bot; git config user.email deploy@bot
          git fetch -q origin deploy-log && git checkout -q deploy-log || git checkout -q --orphan deploy-log
          git rm -rq --cached . 2>/dev/null || true
          cp /tmp/last.log last.log && cp _src/data/lots.json lots.json 2>/dev/null; find _site -name index.html | sed 's#_site##;s#index.html##' | sort > pages.txt 2>/dev/null; git add last.log lots.json pages.txt 2>/dev/null; git add last.log && git commit -qm "log ${GITHUB_SHA::7}" && git push -q origin deploy-log
