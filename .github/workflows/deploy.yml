name: Deploy to Beget

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3,9,15 * * *"   # пересборка со свежими лотами 3 раза в день (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare SSH and load persistent card history
        env:
          SSH_KEY: ${{ secrets.BEGET_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 fond178.beget.tech >> ~/.ssh/known_hosts
          ssh fond178@fond178.beget.tech 'if test -f ~/kirpichinvest-seo/lot_history.json; then cat ~/kirpichinvest-seo/lot_history.json; else printf "[]"; fi' > _src/data/lot_history.json
          python -c "import json; assert isinstance(json.load(open('_src/data/lot_history.json')), list)"

      - name: Build and test site (fail closed on missing feed)
        run: |
          set -euo pipefail
          pip install -q jinja2==3.1.4 markdown==3.7
          curl -fsS --retry 2 --max-time 60 https://check.kirpichinvest.ru/public/lots.json -o /tmp/lots.json
          python - <<'PYCODE'
          import json
          from pathlib import Path
          data = json.load(open('/tmp/lots.json'))
          history = json.load(open('_src/data/lot_history.json'))
          assert isinstance(data, list) and data, 'Empty/invalid feed: keep existing website'
          assert all(isinstance(d, dict) and d.get('id') for d in data)
          assert len({str(d['id']) for d in data}) == len(data), 'Duplicate feed IDs'
          previous_active = sum(d.get('status') == 'active' for d in history)
          assert not previous_active or len(data) >= previous_active * .5, 'Feed fell by over 50%; review before deploying'
          Path('_src/data/lots.json').write_text(json.dumps(data, ensure_ascii=False))
          PYCODE
          curl -fsS --max-time 60 https://check.kirpichinvest.ru/public/results.json -o _src/data/results.json || echo '[]' > _src/data/results.json
          python -m unittest discover -s tests -v
          python _src/build.py | tee /tmp/build.log
          node tests/check_forms.cjs _site/index.html

      - name: Lead API accepts forms from the site domain (CORS)
        run: |
          set -euo pipefail
          origin=$(python -c "import sys; sys.path.insert(0, '_src'); from build import cfg; print(cfg.SITE_URL)")
          allowed=$(curl -sS -X OPTIONS -D - -o /dev/null --max-time 30 -H "Origin: $origin" \
            -H "Access-Control-Request-Method: POST" https://check.kirpichinvest.ru/public/lead \
            | tr -d '\r' | sed -n 's/^[Aa]ccess-[Cc]ontrol-[Aa]llow-[Oo]rigin: //p')
          echo "CORS for $origin: ${allowed:-none}"
          test "$allowed" = "$origin"

      - name: Server backup and deploy
        run: |
          set -euo pipefail
          release="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh fond178@fond178.beget.tech "bash -s -- '$release'" <<'REMOTE'
          set -euo pipefail
          umask 077
          release="$1"
          mkdir -p "$HOME/kirpichinvest-backups/$release" "$HOME/kirpichinvest-seo"
          backup="$HOME/kirpichinvest-backups/$release"
          mkdir -p "$HOME/torggid.ru/public_html"
          tar -czf "$backup/site.tar.gz" -C "$HOME/torggid.ru" public_html
          tar -tzf "$backup/site.tar.gz" >/dev/null
          tar -czf "$backup/old-domain.tar.gz" -C "$HOME/kirpichinvest.ru" public_html
          tar -tzf "$backup/old-domain.tar.gz" >/dev/null
          if test -f "$HOME/kirpichinvest-seo/lot_history.json"; then
            cp "$HOME/kirpichinvest-seo/lot_history.json" "$backup/lot_history.json"
          fi
          sha256sum "$backup/site.tar.gz" "$backup/old-domain.tar.gz" > "$backup/SHA256SUMS"
          printf 'release=%s\nverified_tar=true\n' "$release" > "$backup/manifest.txt"
          cat "$backup/SHA256SUMS"
          printf 'BACKUP=%s\n' "$backup"
          REMOTE
          # Persist history first: a interrupted rsync cannot lose newly known IDs on the next run.
          scp _src/data/lot_history.json fond178@fond178.beget.tech:kirpichinvest-seo/lot_history.next.json
          ssh fond178@fond178.beget.tech 'chmod 600 ~/kirpichinvest-seo/lot_history.next.json && mv ~/kirpichinvest-seo/lot_history.next.json ~/kirpichinvest-seo/lot_history.json'
          rsync -az --delay-updates --delete-delay --exclude '.DS_Store' _site/ fond178@fond178.beget.tech:~/torggid.ru/public_html/
          echo "Published release $release" | tee -a /tmp/build.log

      - name: Verify live publication
        run: |
          set -euo pipefail
          python _src/verify_live.py | tee -a /tmp/build.log
          touch /tmp/site-verified

      - name: Old domain kirpichinvest.ru -> 301 to torggid.ru (only after the new site is verified)
        run: |
          set -euo pipefail
          rsync -az --delay-updates --delete-delay _site_old_domain/ fond178@fond178.beget.tech:~/kirpichinvest.ru/public_html/
          for path in / /torgi/ /stati/proverka-kvartiry-s-torgov/; do
            loc=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://kirpichinvest.ru$path")
            echo "kirpichinvest.ru$path -> $loc" | tee -a /tmp/build.log
            test "$loc" = "301 https://torggid.ru$path"
          done

      - name: IndexNow (Яндекс, Bing) — новые страницы
        continue-on-error: true
        run: |
          git fetch -q origin deploy-log && git show origin/deploy-log:urls.txt > /tmp/prev_urls.txt 2>/dev/null || : > /tmp/prev_urls.txt
          sort -u _site/urls.txt > /tmp/cur.txt; sort -u /tmp/prev_urls.txt > /tmp/prev.txt
          comm -13 /tmp/prev.txt /tmp/cur.txt | head -9000 > /tmp/new_urls.txt
          echo "новых URL для IndexNow: $(wc -l < /tmp/new_urls.txt)" | tee -a /tmp/build.log
          python - <<'PY' | tee -a /tmp/build.log
          import json, urllib.request
          key = json.load(open("_src/config.json")).get("INDEXNOW_KEY", "")
          urls = [u.strip() for u in open("/tmp/new_urls.txt") if u.strip()]
          if key and urls:
              body = json.dumps({"host": "torggid.ru", "key": key, "keyLocation": f"https://torggid.ru/{key}.txt", "urlList": urls}).encode()
              for ep in ("https://yandex.com/indexnow", "https://api.indexnow.org/indexnow"):
                  try:
                      r = urllib.request.urlopen(urllib.request.Request(ep, data=body, headers={"Content-Type": "application/json; charset=utf-8"}), timeout=30)
                      print("IndexNow", ep, r.status)
                  except Exception as e:
                      print("IndexNow", ep, "ошибка:", e)
          PY

      - name: Save log
        if: always()
        env:
          GH: ${{ github.token }}
        run: |
          { echo "== $(date -u) ${GITHUB_SHA::7} ${{ github.event_name }}"; cat /tmp/build.log 2>/dev/null; echo "result: ${{ job.status }}"; } > /tmp/last.log
          find _site -name index.html 2>/dev/null | sed 's#_site##;s#index.html##' | sort > /tmp/pages.txt || true
          cp _site/urls.txt /tmp/urls.txt 2>/dev/null || true
          mkdir /tmp/lr && cd /tmp/lr && git init -q && git remote add origin "https://x-access-token:${GH}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name deploy-bot; git config user.email deploy@bot
          git fetch -q origin deploy-log && git checkout -q deploy-log || git checkout -q --orphan deploy-log
          cp /tmp/last.log .
          if test -f /tmp/site-verified; then cp /tmp/pages.txt /tmp/urls.txt .; fi
          git add -A && git commit -qm "log ${GITHUB_SHA::7}" && git push -q origin deploy-log
