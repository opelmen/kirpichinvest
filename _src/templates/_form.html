{% macro lead_form(scenario, title, sub, button, fields=[]) %}
<form class="form" data-lead novalidate>
  <h3>{{ title }}</h3>{% if sub %}<p class="mute small">{{ sub }}</p>{% endif %}
  <div class="fields">
    <input type="hidden" name="scenario" value="{{ scenario }}">
    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    {% for f in fields %}
      <label for="{{ scenario }}-{{ f.name }}">{{ f.label }}</label>
      {% if f.options %}<select id="{{ scenario }}-{{ f.name }}" name="{{ f.label }}">{% for o in f.options %}<option>{{ o }}</option>{% endfor %}</select>
      {% elif f.area %}<textarea id="{{ scenario }}-{{ f.name }}" name="{{ f.label }}" rows="3" placeholder="{{ f.ph or '' }}">{{ f.value or '' }}</textarea>
      {% else %}<input id="{{ scenario }}-{{ f.name }}" name="{{ f.label }}" placeholder="{{ f.ph or '' }}" value="{{ f.value or '' }}">{% endif %}
    {% endfor %}
    <div class="row2">
      <div><label for="{{ scenario }}-name">Имя</label><input id="{{ scenario }}-name" name="name" autocomplete="given-name"></div>
      <div><label for="{{ scenario }}-contact">Телефон или Telegram *</label><input id="{{ scenario }}-contact" name="contact" required autocomplete="tel" placeholder="+7 ... или @ник"></div>
    </div>
    <label class="consent"><input type="checkbox" name="consent" value="1" required> Согласен на обработку персональных данных по <a href="/politika/" target="_blank">политике</a></label>
    <p class="err"></p>
    <button class="btn" type="submit" style="margin-top:12px;width:100%">{{ button }}</button>
  </div>
  <div class="ok">Заявка отправлена. Свяжемся в рабочее время в течение дня.</div>
</form>
{% endmacro %}
